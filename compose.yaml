name: medihome-benchmark

x-backend-environment: &backend-environment
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: "null"
  LOG_LEVEL: emergency
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-medihome_benchmark}
  DB_USERNAME: ${POSTGRES_USER:-benchmark}
  DB_USER: ${POSTGRES_USER:-benchmark}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-benchmark-only-change-me}
  DB_POOL_MAX: ${DB_POOL_MAX:-1}
  DB_CONNECTION_BUDGET: ${DB_CONNECTION_BUDGET:-4}
  APP_WORKERS: ${APP_WORKERS:-4}
  MAX_REQUESTS: ${MAX_REQUESTS:-10000}
  BENCH_SESSION_TTL_SECONDS: ${BENCH_SESSION_TTL_SECONDS:-14400}
  BENCH_READ_TOKEN: ${BENCH_READ_TOKEN:-bench-read-token}
  BENCH_WRITE_TOKEN: ${BENCH_WRITE_TOKEN:-bench-write-token}

services:
  postgres:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medihome_benchmark}
      POSTGRES_USER: ${POSTGRES_USER:-benchmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchmark-only-change-me}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - benchmark-pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "effective_cache_size=3GB", "-c", "max_connections=100", "-c", "track_io_timing=on", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=on", "-c", "pg_stat_statements.track=all"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d medihome_benchmark"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpus: 4.0
    mem_limit: 3g
    restart: unless-stopped

  laravel-octane:
    profiles: ["octane"]
    build:
      context: laravel-bench
      dockerfile: Dockerfile
    environment:
      <<: *backend-environment
      APP_KEY: ${APP_KEY:-base64:bWVkaWhvbWUtYmVuY2htYXJrLWtleS0yMDI2LTAwMDE=}
      OCTANE_SERVER: frankenphp
    ports: ["${APP_PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    cpus: 4.0
    mem_limit: 4g
    restart: unless-stopped

  adonis:
    profiles: ["adonis"]
    build:
      context: adonis-bench
      dockerfile: Dockerfile
    environment:
      <<: *backend-environment
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      APP_KEY: ${APP_KEY:-base64:bWVkaWhvbWUtYmVuY2htYXJrLWtleS0yMDI2LTAwMDE=}
      APP_URL: http://localhost:8080
      APP_NAME: medihome-benchmark
      LOG_LEVEL: silent
      SESSION_DRIVER: memory
    ports: ["${APP_PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    cpus: 4.0
    mem_limit: 4g
    restart: unless-stopped

  laravel-fpm:
    profiles: ["fpm"]
    build:
      context: laravel-bench
      dockerfile: Dockerfile.fpm
    environment:
      <<: *backend-environment
      APP_KEY: ${APP_KEY:-base64:bWVkaWhvbWUtYmVuY2htYXJrLWtleS0yMDI2LTAwMDE=}
    depends_on:
      postgres: { condition: service_healthy }
    cpus: 3.75
    mem_limit: 3840m
    restart: unless-stopped

  nginx:
    profiles: ["fpm"]
    image: nginx:1.28.0-bookworm
    volumes:
      - ./laravel-bench/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./laravel-bench/public:/app/public:ro
    ports: ["${APP_PORT:-8080}:8080"]
    depends_on: [laravel-fpm]
    cpus: 0.25
    mem_limit: 256m
    restart: unless-stopped

volumes:
  benchmark-pgdata:
    name: medihome-benchmark-pgdata
